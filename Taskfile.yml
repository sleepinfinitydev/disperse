version: '3'

vars:
  IMAGE: '{{.IMAGE | default "ghcr.io/sleepinfinitydev/disperse"}}'
  VERSION: '{{.VERSION | default "0.2.0"}}'
  GIT_HASH:
    sh: git rev-parse --short HEAD

tasks:
  default:
    cmds:
      - task --list
    silent: true

  run:
    desc: "Run the application locally for testing via Python HTTP server"
    vars:
      PORT: '{{.PORT | default "8765"}}'
    cmds:
      - cp js/config.js js/config.js.bak
      - defer: mv -f js/config.js.bak js/config.js
      - |
        python3 -c '
        import json, os
        cfg = {
            "krokiBaseUrl": os.environ.get("KROKI_BASE_URL") or "https://kroki.io",
            "krokiRemoteUrl": os.environ.get("KROKI_REMOTE_URL") or "https://kroki.io",
            "drawioBaseUrl": os.environ.get("DRAWIO_BASE_URL") or "https://embed.diagrams.net",
            "disabledEngines": os.environ.get("KROKI_DISABLED_ENGINES") or "",
            "engineModes": {
                "mermaid": os.environ.get("ENGINE_MODE_MERMAID") or "local",
                "bpmn": os.environ.get("ENGINE_MODE_BPMN") or "local",
                "excalidraw": os.environ.get("ENGINE_MODE_EXCALIDRAW") or "local",
                "diagramsnet": os.environ.get("ENGINE_MODE_DIAGRAMSNET") or "local",
            },
        }
        if "DISPERSE_FOOTER_CREDITS" in os.environ:
            cfg["footerCredits"] = os.environ["DISPERSE_FOOTER_CREDITS"]
        elif "FOOTER_CREDITS" in os.environ:
            cfg["footerCredits"] = os.environ["FOOTER_CREDITS"]
        with open("js/config.js", "r") as f:
            base_js = f.read()
        with open("js/config.js", "w") as f:
            f.write("window.DISPERSE_CONFIG = " + json.dumps(cfg, indent=2) + ";\n" + base_js)
        '
      - echo "Starting server at http://localhost:{{.PORT}} ..."
      - python3 -m http.server {{.PORT}}

  package:
    desc: "Package minimal static web assets into deployable .zip archives (disperse-{{.VERSION}}.zip and disperse.zip)"
    cmds:
      - |
        STAGE_DIR="$(mktemp -d)"
        trap 'rm -rf "$STAGE_DIR"' EXIT
        cp index.html favicon.svg "$STAGE_DIR/"
        cp -r css js examples "$STAGE_DIR/"
        rm -f disperse-{{.VERSION}}.zip disperse.zip
        (cd "$STAGE_DIR" && zip -r -q "{{.USER_WORKING_DIR}}/disperse-{{.VERSION}}.zip" index.html favicon.svg css js examples -x "*.DS_Store" "*.bak" "*.swp" "*~")
        cp disperse-{{.VERSION}}.zip disperse.zip
        echo "Created disperse-{{.VERSION}}.zip and disperse.zip"

  build:
    desc: "Build the OCI container image tagged with version, git commit hash, and latest"
    cmds:
      - |
        if command -v podman >/dev/null 2>&1; then
          echo "Building {{.IMAGE}}:{{.VERSION}}, {{.IMAGE}}:{{.GIT_HASH}}, and {{.IMAGE}}:latest with Podman..."
          podman build -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:{{.GIT_HASH}} -t {{.IMAGE}}:latest -f Containerfile .
        elif command -v docker >/dev/null 2>&1; then
          echo "Building {{.IMAGE}}:{{.VERSION}}, {{.IMAGE}}:{{.GIT_HASH}}, and {{.IMAGE}}:latest with Docker..."
          docker build -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:{{.GIT_HASH}} -t {{.IMAGE}}:latest -f Containerfile .
        else
          echo "Error: Neither Podman nor Docker was found in PATH."
          exit 1
        fi

  push:
    desc: "Push the OCI container image (version, git hash, and latest tags) to the registry"
    deps: [build]
    cmds:
      - |
        if command -v podman >/dev/null 2>&1; then
          echo "Pushing {{.IMAGE}}:{{.VERSION}}, {{.IMAGE}}:{{.GIT_HASH}}, and {{.IMAGE}}:latest with Podman..."
          podman push {{.IMAGE}}:{{.VERSION}}
          podman push {{.IMAGE}}:{{.GIT_HASH}}
          podman push {{.IMAGE}}:latest
        elif command -v docker >/dev/null 2>&1; then
          echo "Pushing {{.IMAGE}}:{{.VERSION}}, {{.IMAGE}}:{{.GIT_HASH}}, and {{.IMAGE}}:latest with Docker..."
          docker push {{.IMAGE}}:{{.VERSION}}
          docker push {{.IMAGE}}:{{.GIT_HASH}}
          docker push {{.IMAGE}}:latest
        else
          echo "Error: Neither Podman nor Docker was found in PATH."
          exit 1
        fi
