version: '3'

vars:
  IMAGE: '{{.IMAGE | default "ghcr.io/sleepinfinitydev/disperse"}}'
  GIT_HASH:
    sh: git rev-parse --short HEAD

tasks:
  default:
    cmds:
      - task --list
    silent: true

  run:
    desc: "Run the application locally for testing via Python HTTP server"
    vars:
      PORT: '{{.PORT | default "8765"}}'
    env:
      FOOTER_CREDITS: '{{.FOOTER_CREDITS}}'
      KROKI_BASE_URL: '{{.KROKI_BASE_URL}}'
    cmds:
      - defer: printf 'window.DISPERSE_CONFIG = {};\n' > js/config.js
      - |
        python3 -c 'import json, os; cfg = {k: os.environ[e] for k, e in [("krokiBaseUrl", "KROKI_BASE_URL"), ("footerCredits", "FOOTER_CREDITS")] if os.environ.get(e)}; open("js/config.js", "w").write("window.DISPERSE_CONFIG = " + json.dumps(cfg) + ";\n")'
      - echo "Starting server at http://localhost:{{.PORT}} ..."
      - python3 -m http.server {{.PORT}}

  build:
    desc: "Build the OCI container image tagged with git commit hash and latest"
    cmds:
      - |
        if command -v podman >/dev/null 2>&1; then
          echo "Building {{.IMAGE}}:{{.GIT_HASH}} and {{.IMAGE}}:latest with Podman..."
          podman build -t {{.IMAGE}}:{{.GIT_HASH}} -t {{.IMAGE}}:latest -f Containerfile .
        elif command -v docker >/dev/null 2>&1; then
          echo "Building {{.IMAGE}}:{{.GIT_HASH}} and {{.IMAGE}}:latest with Docker..."
          docker build -t {{.IMAGE}}:{{.GIT_HASH}} -t {{.IMAGE}}:latest -f Containerfile .
        else
          echo "Error: Neither Podman nor Docker was found in PATH."
          exit 1
        fi

  push:
    desc: "Push the OCI container image (git hash and latest tags) to the registry"
    deps: [build]
    cmds:
      - |
        if command -v podman >/dev/null 2>&1; then
          echo "Pushing {{.IMAGE}}:{{.GIT_HASH}} and {{.IMAGE}}:latest with Podman..."
          podman push {{.IMAGE}}:{{.GIT_HASH}}
          podman push {{.IMAGE}}:latest
        elif command -v docker >/dev/null 2>&1; then
          echo "Pushing {{.IMAGE}}:{{.GIT_HASH}} and {{.IMAGE}}:latest with Docker..."
          docker push {{.IMAGE}}:{{.GIT_HASH}}
          docker push {{.IMAGE}}:latest
        else
          echo "Error: Neither Podman nor Docker was found in PATH."
          exit 1
        fi
