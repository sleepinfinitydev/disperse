{{- if .Values.kroki.enabled -}}
{{- $krokiPort := int (.Values.kroki.port | default 8000) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "disperse.krokiFullname" . }}
  labels:
    {{- include "disperse.krokiLabels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.kroki.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "disperse.krokiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with (mergeOverwrite (deepCopy (.Values.commonAnnotations | default dict)) (.Values.kroki.podAnnotations | default dict)) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "disperse.krokiLabels" . | nindent 8 }}
        {{- with .Values.kroki.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "disperse.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "disperse.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.kroki.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kroki
          {{- with .Values.kroki.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "disperse.krokiImage" . | quote }}
          imagePullPolicy: {{ .Values.kroki.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $krokiPort }}
              protocol: TCP
          env:
            - name: KROKI_PORT
              value: {{ $krokiPort | quote }}
            - name: KROKI_LISTEN
              value: {{ printf "0.0.0.0:%d" $krokiPort | quote }}
            - name: KROKI_SAFE_MODE
              value: {{ .Values.kroki.safeMode | default "SECURE" | quote }}
            - name: KROKI_MAX_URI_LENGTH
              value: {{ .Values.kroki.maxUriLength | default 16384 | quote }}
            {{- with .Values.kroki.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.kroki.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: kroki-tmp
              mountPath: /tmp
              subPath: kroki-tmp
            - name: kroki-tmp
              mountPath: /home/kroki
              subPath: kroki-home
      volumes:
        - name: kroki-tmp
          emptyDir: {}
      {{- with .Values.kroki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
