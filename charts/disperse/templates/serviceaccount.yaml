{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "disperse.serviceAccountName" . }}
  labels:
    {{- include "disperse.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy (.Values.commonAnnotations | default dict)) (.Values.serviceAccount.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
