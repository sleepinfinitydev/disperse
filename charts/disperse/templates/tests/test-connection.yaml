{{- $testImg := (.Values.test | default dict).image | default dict -}}
{{- $krokiSvcPort := int (include "disperse.krokiPort" .) -}}
{{- $drawioSvcPort := int (include "disperse.drawioPort" .) -}}
{{- $drawio := .Values.drawio | default dict -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "disperse.fullname" . }}-test-connection"
  labels:
    {{- include "disperse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- include "disperse.imagePullSecrets" . | nindent 2 }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ include "disperse.testImage" . | quote }}
      imagePullPolicy: {{ $testImg.pullPolicy | default "IfNotPresent" }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -ec
        - |
          wget -qO- "http://{{ include "disperse.fullname" . }}:{{ .Values.service.port }}/" >/dev/null
          wget -qO- "http://{{ include "disperse.fullname" . }}:{{ .Values.service.port }}/js/config.js" >/dev/null
          {{- if .Values.kroki.enabled }}
          wget -qO- "http://{{ include "disperse.krokiFullname" . }}:{{ $krokiSvcPort }}/health" >/dev/null
          {{- end }}
          {{- if $drawio.enabled }}
          wget -qO- "http://{{ include "disperse.drawioFullname" . }}:{{ $drawioSvcPort }}/" >/dev/null
          {{- end }}
  restartPolicy: Never
