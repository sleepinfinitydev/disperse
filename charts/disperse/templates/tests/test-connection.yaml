apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "disperse.fullname" . }}-test-connection"
  labels:
    {{- include "disperse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - /bin/sh
        - -ec
        - |
          wget -qO- "http://{{ include "disperse.fullname" . }}:{{ .Values.service.port }}/" >/dev/null
          {{- if .Values.kroki.enabled }}
          wget -qO- "http://{{ include "disperse.fullname" . }}:{{ .Values.service.port }}/kroki/health" >/dev/null
          {{- end }}
  restartPolicy: Never
