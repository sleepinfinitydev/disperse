{{- $kIng := .Values.kroki.ingress | default dict -}}
{{- if and .Values.kroki.enabled $kIng.enabled -}}
{{- $krokiFullName := include "disperse.krokiFullname" . -}}
{{- $krokiSvcPort := int (include "disperse.krokiPort" .) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $krokiFullName }}
  labels:
    {{- include "disperse.krokiLabels" . | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy (.Values.commonAnnotations | default dict)) ($kIng.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $kIng.className }}
  ingressClassName: {{ $kIng.className | quote }}
  {{- end }}
  {{- if $kIng.tls }}
  tls:
    {{- range $kIng.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- if .secretName }}
      secretName: {{ .secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $kIng.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $krokiFullName }}
                port:
                  number: {{ $krokiSvcPort }}
          {{- end }}
    {{- end }}
{{- end }}
