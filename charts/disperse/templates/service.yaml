apiVersion: v1
kind: Service
metadata:
  name: {{ include "disperse.fullname" . }}
  labels:
    {{- include "disperse.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy (.Values.commonAnnotations | default dict)) (.Values.service.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "disperse.selectorLabels" . | nindent 4 }}
