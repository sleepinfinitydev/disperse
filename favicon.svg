<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Incoming beam -->
  <line x1="4" y1="32" x2="18" y2="32" stroke="#0080c0" stroke-width="4" stroke-linecap="round"/>
  <!-- Dispersed graph edges (Tetradic 4-way split) -->
  <path d="M30 22 L52 10" stroke="#0080c0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M33 28 L54 24" stroke="#4b6be8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M33 36 L54 40" stroke="#d96b1f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M30 42 L52 54" stroke="#c89614" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Prism / Root Node -->
  <polygon points="14,14 36,32 14,50" fill="#0080c0" fill-opacity="0.18" stroke="#0080c0" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 4 Tetradic Diagram Nodes -->
  <circle cx="54" cy="10" r="5" fill="#0080c0"/>
  <circle cx="56" cy="24" r="5" fill="#4b6be8"/>
  <circle cx="56" cy="40" r="5" fill="#d96b1f"/>
  <circle cx="54" cy="54" r="5" fill="#c89614"/>
</svg>
